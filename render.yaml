services:
  - type: web
    name: leave-management-backend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite

  - type: static
    name: leave-management-frontend
    region: oregon
    plan: free
    staticPublishPath: frontend/dist
    buildCommand: cd frontend && npm ci && npm run build
    envVars:
      - key: NODE_ENV
        value: production
